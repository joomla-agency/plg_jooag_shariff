; Tab: Zähler
PLG_JOOAG_SHARIFF_COUNTER="Zähler"
PLG_JOOAG_SHARIFF_COUNTER_INTRO="Der Zähler zeigt an den Knöpfen, wie oft eine Seite geteilt wurde. <strong>Ihr Server</strong> fragt dafür bei den Netzwerken nach – nicht der Browser der Besucher – und merkt sich die Zahlen eine Weile; Besucher werden dabei keinem Netzwerk bekannt.<ul><li>Zahlen liefern derzeit Pinterest, VK, XING und Buffer. Facebook nur mit eigener App (App-ID und Secret im Reiter <em>Dienste</em> beim Facebook-Knopf). Reddit beantwortet solche Anfragen meist nicht.</li><li>Sichtbar sind die Zahlen bei der Knopfart „Symbol und Zahl“ und – ab Tablet-Breite – bei „Symbol und Text“, nie bei „Nur Symbol“. Gezählt wird erst, wenn eine Seite unter ihrer öffentlichen Adresse geteilt wurde.</li><li><strong>Wichtig:</strong> Die Netzwerke zählen jede Adresse einzeln – mit und ohne <code>www.</code> sind zwei verschiedene Seiten. Leiten Sie daher alles auf eine Schreibweise um (beim Hoster oder in der <code>.htaccess</code>).</li></ul>"
PLG_JOOAG_SHARIFF_SHARE_COUNTER_BACKEND="Zähler"
PLG_JOOAG_SHARIFF_CACHE_TIME="Zahlen merken (Sekunden)"
PLG_JOOAG_SHARIFF_CACHE_TIME_DESC="Wie lange eine Zahl gilt, bevor der Server erneut fragt. Mindestens 60."
PLG_JOOAG_SHARIFF_CACHE_TIMEOUT="Wartezeit je Netzwerk (Sekunden)"
PLG_JOOAG_SHARIFF_CACHE_TIMEOUT_DESC="So lange wartet der Server höchstens auf die Antwort eines Netzwerks."
PLG_JOOAG_SHARIFF_DATA_URL="Gezählte Domains"
PLG_JOOAG_SHARIFF_DATA_URL_DESC="Gezählt wird nur für Adressen dieser Website. Eine eigene Liste braucht es nur, wenn die Website unter mehreren Domains läuft."
PLG_JOOAG_SHARIFF_DATA_URL_AUTOMATIC="Automatisch (diese Domain)"
PLG_JOOAG_SHARIFF_DATA_URL_CUSTOM="Eigene Liste"
PLG_JOOAG_SHARIFF_DATA_URL_CUSTOM_INPUT="Domains"
PLG_JOOAG_SHARIFF_DATA_URL_CUSTOM_DESC="Nur Adressen dieser Domains werden gezählt, z. B. example.com (www. ist eingeschlossen)."

; Tab: Erweitert
PLG_JOOAG_SHARIFF_EXPERTS="Erweitert"
PLG_JOOAG_SHARIFF_EXPERTS_INTRO="Nur nötig, wenn Ihr Template die Knöpfe selbst gestaltet.<ul><li><strong>Stylesheet „Keins“:</strong> Das Plugin lädt kein CSS. Ihr Template gestaltet dann die Klassen <code>.shariff</code>, <code>.shariff-button</code>, <code>.share_text</code>, <code>.share_count</code> und die Dienst-Klassen wie <code>.facebook</code> – dieselben wie bei Heise Shariff.</li><li><strong>Skript „Keins“:</strong> Die Knöpfe öffnen sich als normale Links in einem neuen Tab statt in einem kleinen Fenster; Drucken, Link kopieren und der Zähler funktionieren dann nicht. Das Skript ist klein und braucht kein jQuery.</li></ul>"
PLG_JOOAG_SHARIFF_ASSETS_CSS="Stylesheet"
PLG_JOOAG_SHARIFF_ASSETS_CSS_DESC="„Keins“, wenn Ihr Template die Knöpfe selbst gestaltet."
PLG_JOOAG_SHARIFF_ASSETS_JS="Skript"
PLG_JOOAG_SHARIFF_ASSETS_JS_DESC="Für Teilen-Fenster, Drucken, Link kopieren und den Zähler."
PLG_JOOAG_SHARIFF_ASSETS_INCLUDED="Mitgeliefert"
