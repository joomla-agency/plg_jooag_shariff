PLG_JOOAG_SHARIFF_SHOW_ON_ALL_EXPECTED_SELECTED="Bei allen außer den ausgewählten"
PLG_JOOAG_SHARIFF_SHOW_NOWHERE="Bei keinem"
PLG_JOOAG_SHARIFF_PLACE_EVERYWHERE="2. Überall"
PLG_JOOAG_OUTPUT_EVERYWHERE="Überall anzeigen"
PLG_JOOAG_OUTPUT_EVERYWHERE_DESC="Die Knöpfe stehen über und/oder unter dem Inhalt <strong>jeder</strong> Seite – egal, welche Komponente ihn liefert (Kontakte, Formulare, Shop, Kalender …). Das braucht keine weitere Einrichtung, ist aber die gröbste Methode: Passt es in einer Komponente nicht, schließen Sie sie unten unter <em>Nicht in diesen Komponenten</em> aus.<br><strong>Hinweis:</strong> Sind „Automatisch in Beiträgen“ und „Überall“ beide an, erscheinen in Beiträgen zwei Leisten. Schalten Sie dann eines davon aus."
PLG_JOOAG_SHARIFF_POSITION_EVERYWHERE_DESC="Über oder unter dem Inhalt der Komponente; Menü, Kopf- und Fußbereich des Templates bleiben unberührt."
PLG_JOOAG_SHARIFF_POSITION_BEFORE_PAGE="Über dem Seiteninhalt"
PLG_JOOAG_SHARIFF_POSITION_AFTER_PAGE="Unter dem Seiteninhalt"
PLG_JOOAG_SHARIFF_POSITION_BOTH_PAGE="Über und unter dem Seiteninhalt"
PLG_JOOAG_SHARIFF_PLACE_SHORTTAG="3. Kurzbefehl {shariff}"
PLG_JOOAG_OUTPUT_SHORTTAG_MODE="Kurzbefehl erlauben"
PLG_JOOAG_OUTPUT_SHORTTAG_MODE_DESC="Schreiben Sie <code>{shariff}</code> genau an die Stelle, an der die Knöpfe stehen sollen:<ul><li>in einen <strong>Beitrag</strong> – funktioniert sofort, auch wenn „Automatisch in Beiträgen“ aus ist,</li><li>in ein <strong>Modul vom Typ „Eigener Inhalt“</strong> – dort unter <em>Optionen</em> „Inhalte vorbereiten“ auf <em>Ja</em> stellen. So stehen die Knöpfe zum Beispiel in einer Seitenleiste auf allen Seiten.</li></ul>Pro Stelle können Sie vom Reiter <em>Aussehen</em> abweichen, auch kombiniert:<br><code>{shariff theme=grey}</code> · <code>{shariff theme=white}</code> · <code>{shariff orientation=vertical}</code> · <code>{shariff style=icon}</code> · <code>{shariff theme=white orientation=vertical style=icon}</code><br>Möglich sind <code>theme</code> = color, grey, white · <code>orientation</code> = horizontal, vertical · <code>style</code> = standard, icon, icon-count. Unbekannte Angaben werden ignoriert. Ist der Kurzbefehl aus, bleibt <code>{shariff}</code> als Text stehen."
PLG_JOOAG_SHARIFF_DISALLOW_COMPONENTS="Nicht in diesen Komponenten"
PLG_JOOAG_SHARIFF_DISALLOW_COMPONENTS_DESC="Auf Seiten der hier gewählten Komponenten erscheinen nie Knöpfe – weder automatisch noch per Kurzbefehl, auch nicht aus Modulen; ein <code>{shariff}</code> wird dort still entfernt. Beispiele: <code>com_users</code> (Anmelden, Registrieren), <code>com_finder</code> (Suchergebnisse)."
PLG_JOOAG_SHARIFF_SELECT_COMPONENT="- Komponente wählen -"
PLG_JOOAG_SHARIFF_TAB_COMPONENTS="Komponente"

; Tab: Aussehen
PLG_JOOAG_SHARIFF_LOOK="Aussehen"
PLG_JOOAG_SHARIFF_LOOK_INTRO="Gilt für alle Knöpfe; beim Kurzbefehl können Sie es pro Stelle ändern (siehe Reiter <em>Ausgabe</em>).<ul><li><strong>Ausrichtung:</strong> Waagerecht stehen die Knöpfe nebeneinander und brechen auf schmalen Bildschirmen um; senkrecht stehen sie untereinander, etwa für eine Seitenleiste.</li><li><strong>Knopfart:</strong> „Symbol und Text“ zeigt den Dienst mit kurzem Text (auf Handys nur das Symbol), „Nur Symbol“ spart Platz, „Symbol und Zahl“ zeigt neben dem Symbol, wie oft die Seite geteilt wurde – dafür muss der Zähler an sein.</li></ul>Die Knöpfe haben das bekannte Shariff-Aussehen; eigenes CSS Ihres Templates mit den Shariff-Klassen (<code>.shariff</code>, <code>.shariff-button</code>, <code>.share_text</code> …) greift weiter."
