PLG_JOOAG_SHARIFF="System - JooAg Shariff"
PLG_JOOAG_SHARIFF_XML_DESCRIPTION="<p>Teilen-Knöpfe mit Datenschutz: einfache Links im Aussehen von Heise Shariff – ein Netzwerk erfährt erst etwas, wenn jemand klickt. Keine fremden Skripte, keine Cookies, kein Tracking.</p><p>Quellcode und Anleitung: <a href='https://github.com/joomla-agency/plg_jooag_shariff' target='_blank' rel='noopener'>GitHub</a> · entwickelt von der <a href='https://joomla-agentur.de' target='_blank' rel='noopener'>Joomla Agentur</a>, nach der Idee von <a href='https://github.com/heiseonline/shariff' target='_blank' rel='noopener'>Heise Shariff</a>.</p>"

; Tab: Dienste
PLG_JOOAG_SHARIFF_SETTINGS="Dienste"
PLG_JOOAG_SHARIFF_SETTINGS_INTRO="Hier legen Sie fest, welche Knöpfe erscheinen. <strong>Jede Zeile ist ein Knopf</strong>, in der Reihenfolge der Liste: mit <strong>+</strong> eine Zeile hinzufügen, mit <strong>−</strong> entfernen, mit dem blauen Pfeilkreuz an eine andere Stelle ziehen. Wo die Knöpfe erscheinen, stellen Sie im Reiter <em>Ausgabe</em> ein.<ul><li><strong>X (Twitter):</strong> Unter <em>Optionen</em> optional Ihr X-Benutzername, er wird als „via @name“ angehängt.</li><li><strong>Facebook:</strong> App-ID und Secret nur für den Zähler nötig (Reiter <em>Zähler</em>); zum Teilen genügt der Knopf.</li><li><strong>E-Mail:</strong> Leer oder <code>mailto:</code> öffnet das Mailprogramm der Besucher, <code>mailto:name@example.com</code> mit Empfänger. Betreff und Text gelten nur bei <code>mailto:</code>, im Text wird <code>{url}</code> durch die Seitenadresse ersetzt. Jede andere Adresse (z. B. Ihr Kontaktformular) wird stattdessen geöffnet.</li><li><strong>Info:</strong> ein Knopf, der erklärt, warum die Knöpfe datenschutzfreundlich sind. Tragen Sie die ID eines eigenen Joomla-Beitrags ein; ohne ID verweist er auf die Shariff-Erklärung von c't.</li><li><strong>Mastodon (Fediverse):</strong> öffnet Share₂Fedi, dort wählen Besucher ihre eigene Instanz.</li></ul><strong>Datenschutz:</strong> Die Knöpfe sind normale Links. Beim Laden der Seite wird kein Netzwerk kontaktiert, erst wenn jemand klickt."
PLG_JOOAG_SHARIFF_SETTINGS_DESC="Eine Zeile pro Knopf, in der Reihenfolge auf der Website."
