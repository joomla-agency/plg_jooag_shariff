PLG_JOOAG_SHARIFF_CATEGORY_ASSIGNMENT_DESC="In welchen Kategorien die Knöpfe automatisch erscheinen."
PLG_JOOAG_SHARIFF_CATEGORY_SELECT="Ausgewählte Kategorien"
PLG_JOOAG_SHARIFF_MENU_ASSIGNMENT="Menüeinträge"
PLG_JOOAG_SHARIFF_MENU_ASSIGNMENT_DESC="Bei welchen Menüeinträgen, also auf welchen Seiten, die Knöpfe erscheinen."
PLG_JOOAG_SHARIFF_MENU_SELECT="Ausgewählte Menüeinträge"
PLG_JOOAG_SHARIFF_SHOW_ON_ALL="Bei allen"
