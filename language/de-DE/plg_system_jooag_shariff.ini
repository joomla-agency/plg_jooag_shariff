; Tab: Ausgabe
PLG_JOOAG_SHARIFF_OUTPUT="Ausgabe"
PLG_JOOAG_SHARIFF_OUTPUT_INTRO="Es gibt <strong>drei Wege</strong>, die Knöpfe auf die Website zu bringen. Sie lassen sich beliebig kombinieren; ist alles aus, erscheinen keine Knöpfe.<ol><li><strong>Automatisch in Joomla-Beiträgen</strong> – über und/oder unter jedem Beitrag.</li><li><strong>Überall</strong> – über und/oder unter dem Inhalt jeder Seite, auch bei Kontakten, Formularen oder einem Shop.</li><li><strong>Kurzbefehl {shariff}</strong> – genau an der Stelle, an der Sie ihn in einen Beitrag oder ein Modul schreiben.</li></ol>Wie die Knöpfe aussehen, stellen Sie im Reiter <em>Aussehen</em> ein."
PLG_JOOAG_SHARIFF_PLACE_ARTICLES="1. Automatisch in Joomla-Beiträgen"
PLG_JOOAG_SHARIFF_PLACE_ARTICLES_DESC="Die Knöpfe erscheinen, wenn ein einzelner Beitrag angezeigt wird – nicht in Blog-, Listen- oder Hauptbeitrags-Übersichten. Mit Kategorien und Menüeinträgen schränken Sie ein, wo."
PLG_JOOAG_SHARIFF_JOOMLA_CONTENT="Automatisch in Beiträgen"
PLG_JOOAG_SHARIFF_JOOMLA_CONTENT_DESC="Aus: in Beiträgen erscheinen Knöpfe nur dort, wo der Kurzbefehl steht."
PLG_JOOAG_SHARIFF_POSITION="Position"
PLG_JOOAG_SHARIFF_POSITION_ARTICLES_DESC="Über oder unter dem Beitragstext (Joomlas Plätze vor und nach dem Inhalt eines Beitrags)."
PLG_JOOAG_SHARIFF_POSITION_BEFORE="Über dem Beitrag"
PLG_JOOAG_SHARIFF_POSITION_AFTER="Unter dem Beitrag"
PLG_JOOAG_SHARIFF_POSITION_BOTH="Über und unter dem Beitrag"
