PLG_JOOAG_SHARIFF_THEME_COLOR="Color"
PLG_JOOAG_SHARIFF_THEME_GREY="Grey"
PLG_JOOAG_SHARIFF_THEME_WHITE="White"
PLG_JOOAG_SHARIFF_STYLE="Button style"
PLG_JOOAG_SHARIFF_STYLE_STANDARD="Icon and text"
PLG_JOOAG_SHARIFF_STYLE_ICON="Icon only"
PLG_JOOAG_SHARIFF_STYLE_ICON_COUNT="Icon and count"

; Tab: Counter
PLG_JOOAG_SHARIFF_COUNTER="Counter"
PLG_JOOAG_SHARIFF_COUNTER_INTRO="The counter shows at the buttons how often a page was shared. <strong>Your server</strong> asks the networks – not the visitor's browser – and keeps the numbers for a while; visitors are not revealed to any network.<ul><li>Numbers currently come from Pinterest, VK, XING and Buffer. Facebook only with your own app (app ID and secret on the <em>Services</em> tab at the Facebook button). Reddit mostly does not answer such requests.</li><li>Numbers are visible with the button style “Icon and count” and – from tablet width – with “Icon and text”, never with “Icon only”. A page is only counted once it was shared under its public address.</li><li><strong>Important:</strong> the networks count every address separately – with and without <code>www.</code> are two different pages. Redirect everything to one spelling (at your host or in the <code>.htaccess</code>).</li></ul>"
PLG_JOOAG_SHARIFF_SHARE_COUNTER_BACKEND="Counter"
PLG_JOOAG_SHARIFF_CACHE_TIME="Keep counts (seconds)"
PLG_JOOAG_SHARIFF_CACHE_TIME_DESC="How long a number is used before the server asks again. At least 60."
PLG_JOOAG_SHARIFF_CACHE_TIMEOUT="Waiting time per network (seconds)"
PLG_JOOAG_SHARIFF_CACHE_TIMEOUT_DESC="The longest the server waits for a network's answer."
PLG_JOOAG_SHARIFF_DATA_URL="Counted domains"
PLG_JOOAG_SHARIFF_DATA_URL_DESC="Only addresses of this website are counted. An own list is only needed when the site runs under several domains."
PLG_JOOAG_SHARIFF_DATA_URL_AUTOMATIC="Automatic (this domain)"
PLG_JOOAG_SHARIFF_DATA_URL_CUSTOM="Own list"
PLG_JOOAG_SHARIFF_DATA_URL_CUSTOM_INPUT="Domains"
PLG_JOOAG_SHARIFF_DATA_URL_CUSTOM_DESC="Only addresses on these domains are counted, e.g. example.com (www. is included)."

; Tab: Advanced
PLG_JOOAG_SHARIFF_EXPERTS="Advanced"
PLG_JOOAG_SHARIFF_EXPERTS_INTRO="Only needed when your template styles the buttons itself.<ul><li><strong>Stylesheet “None”:</strong> the plugin loads no CSS. Your template then styles the classes <code>.shariff</code>, <code>.shariff-button</code>, <code>.share_text</code>, <code>.share_count</code> and the service classes such as <code>.facebook</code> – the same as in Heise Shariff.</li><li><strong>Script “None”:</strong> the buttons open as plain links in a new tab instead of a small window; print, copy link and the counter do not work then. The script is small and needs no jQuery.</li></ul>"
PLG_JOOAG_SHARIFF_ASSETS_CSS="Stylesheet"
PLG_JOOAG_SHARIFF_ASSETS_CSS_DESC="“None” if your template styles the buttons itself."
PLG_JOOAG_SHARIFF_ASSETS_JS="Script"
PLG_JOOAG_SHARIFF_ASSETS_JS_DESC="For share windows, print, copy link and the counter."
PLG_JOOAG_SHARIFF_ASSETS_INCLUDED="Included"
PLG_JOOAG_SHARIFF_ASSETS_NONE="None"

