PLG_JOOAG_SHARIFF="System - JooAg Shariff"
PLG_JOOAG_SHARIFF_XML_DESCRIPTION="<p>Share buttons with privacy in mind: plain links in the look of Heise Shariff – a network is only contacted when the visitor clicks. No external scripts, no cookies, no tracking.</p><p>Source code and documentation: <a href='https://github.com/joomla-agency/plg_jooag_shariff' target='_blank' rel='noopener'>GitHub</a> · developed by <a href='https://joomla-agentur.de' target='_blank' rel='noopener'>Joomla Agentur</a>, based on the idea of <a href='https://github.com/heiseonline/shariff' target='_blank' rel='noopener'>Heise Shariff</a>.</p>"

; Tab: Services
PLG_JOOAG_SHARIFF_SETTINGS="Services"
PLG_JOOAG_SHARIFF_SETTINGS_INTRO="Choose the buttons here. <strong>Each row is one button</strong>, in the order of the list: <strong>+</strong> adds a row, <strong>−</strong> removes it, the blue cross of arrows drags it to another place. Where the buttons appear is set on the <em>Output</em> tab.<ul><li><strong>X (Twitter):</strong> optionally your X username under <em>Options</em>; it is added as “via @name”.</li><li><strong>Facebook:</strong> app ID and secret are only needed for the counter (<em>Counter</em> tab); sharing works without them.</li><li><strong>Mail:</strong> empty or <code>mailto:</code> opens the visitor's mail program, <code>mailto:name@example.com</code> with a recipient. Subject and text are only used with <code>mailto:</code>; <code>{url}</code> in the text becomes the page address. Any other address (e.g. your contact form) is opened instead.</li><li><strong>Info:</strong> a button that explains why these buttons respect privacy. Enter the ID of one of your Joomla articles; without an ID it links to the Shariff explanation of c't.</li><li><strong>Mastodon (Fediverse):</strong> opens Share₂Fedi, where visitors choose their own instance.</li></ul><strong>Privacy:</strong> the buttons are plain links. Loading the page contacts no network; only a click does."
PLG_JOOAG_SHARIFF_SETTINGS_DESC="One row per button, in the order shown on the site."
