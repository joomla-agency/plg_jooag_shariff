; Tab: Output
PLG_JOOAG_SHARIFF_OUTPUT="Output"
PLG_JOOAG_SHARIFF_OUTPUT_INTRO="There are <strong>three ways</strong> to put the buttons on your site. Combine them as you like; with all of them off, no buttons appear.<ol><li><strong>Automatically in Joomla articles</strong> – above and/or below every article.</li><li><strong>Everywhere</strong> – above and/or below the content of every page, also for contacts, forms or a shop.</li><li><strong>Short tag {shariff}</strong> – exactly where you write it into an article or a module.</li></ol>The look of the buttons is set on the <em>Look</em> tab."
PLG_JOOAG_SHARIFF_PLACE_ARTICLES="1. Automatically in Joomla articles"
PLG_JOOAG_SHARIFF_PLACE_ARTICLES_DESC="The buttons appear when a single article is shown – not in blog, list or featured overviews. Categories and menu items limit where."
PLG_JOOAG_SHARIFF_JOOMLA_CONTENT="Automatically in articles"
PLG_JOOAG_SHARIFF_JOOMLA_CONTENT_DESC="Off: articles only show buttons where the short tag is."
PLG_JOOAG_SHARIFF_POSITION="Position"
PLG_JOOAG_SHARIFF_POSITION_ARTICLES_DESC="Above or below the article text (Joomla's places before and after an article's content)."
PLG_JOOAG_SHARIFF_POSITION_BEFORE="Above the article"
PLG_JOOAG_SHARIFF_POSITION_AFTER="Below the article"
PLG_JOOAG_SHARIFF_POSITION_BOTH="Above and below the article"
PLG_JOOAG_SHARIFF_CATEGORY_ASSIGNMENT="Categories"
PLG_JOOAG_SHARIFF_CATEGORY_ASSIGNMENT_DESC="In which categories the buttons appear automatically."
PLG_JOOAG_SHARIFF_CATEGORY_SELECT="Selected categories"
PLG_JOOAG_SHARIFF_MENU_ASSIGNMENT="Menu items"
PLG_JOOAG_SHARIFF_MENU_ASSIGNMENT_DESC="For which menu items, i.e. on which pages, the buttons appear."
PLG_JOOAG_SHARIFF_MENU_SELECT="Selected menu items"
PLG_JOOAG_SHARIFF_SHOW_ON_ALL="All"
PLG_JOOAG_SHARIFF_SHOW_ON_SELECTED="Only the selected"
PLG_JOOAG_SHARIFF_SHOW_ON_ALL_EXPECTED_SELECTED="All except the selected"
PLG_JOOAG_SHARIFF_SHOW_NOWHERE="None"
PLG_JOOAG_SHARIFF_PLACE_EVERYWHERE="2. Everywhere"
PLG_JOOAG_OUTPUT_EVERYWHERE="Show everywhere"
PLG_JOOAG_OUTPUT_EVERYWHERE_DESC="The buttons appear above and/or below the content of <strong>every</strong> page, whatever component provides it (contacts, forms, shop, calendar …). It needs no further setup but is the roughest way: where it does not fit a component, exclude it below under <em>Disallow components</em>.<br><strong>Note:</strong> with “Automatically in articles” and “Everywhere” both on, articles show two bars. Switch one of them off then."
PLG_JOOAG_SHARIFF_POSITION_EVERYWHERE_DESC="Above or below the component's content; menu, header and footer of the template stay untouched."
PLG_JOOAG_SHARIFF_POSITION_BEFORE_PAGE="Above the page content"
PLG_JOOAG_SHARIFF_POSITION_AFTER_PAGE="Below the page content"
PLG_JOOAG_SHARIFF_POSITION_BOTH_PAGE="Above and below the page content"
PLG_JOOAG_SHARIFF_PLACE_SHORTTAG="3. Short tag {shariff}"
PLG_JOOAG_OUTPUT_SHORTTAG_MODE="Allow short tag"
PLG_JOOAG_OUTPUT_SHORTTAG_MODE_DESC="Write <code>{shariff}</code> exactly where the buttons shall appear:<ul><li>into an <strong>article</strong> – works right away, also with “Automatically in articles” off,</li><li>into a <strong>Custom module</strong> – set its option “Prepare Content” to <em>Yes</em>. This way the buttons can sit in a sidebar on every page, for example.</li></ul>Per place you can differ from the <em>Look</em> tab, also combined:<br><code>{shariff theme=grey}</code> · <code>{shariff theme=white}</code> · <code>{shariff orientation=vertical}</code> · <code>{shariff style=icon}</code> · <code>{shariff theme=white orientation=vertical style=icon}</code><br>Possible are <code>theme</code> = color, grey, white · <code>orientation</code> = horizontal, vertical · <code>style</code> = standard, icon, icon-count. Unknown values are ignored. With the short tag off, <code>{shariff}</code> stays as plain text."
PLG_JOOAG_SHARIFF_DISALLOW_COMPONENTS="Disallow components"
PLG_JOOAG_SHARIFF_DISALLOW_COMPONENTS_DESC="Pages of the components chosen here never show buttons – neither automatically nor by short tag, not even from modules; a <code>{shariff}</code> is quietly removed there. Examples: <code>com_users</code> (login, registration), <code>com_finder</code> (search results)."
PLG_JOOAG_SHARIFF_SELECT_COMPONENT="- Select a component -"
PLG_JOOAG_SHARIFF_TAB_COMPONENTS="Component"

; Tab: Look
PLG_JOOAG_SHARIFF_LOOK="Look"
PLG_JOOAG_SHARIFF_LOOK_INTRO="Applies to all buttons; the short tag can change it per place (see the <em>Output</em> tab).<ul><li><strong>Orientation:</strong> horizontal buttons stand side by side and wrap on narrow screens; vertical ones are stacked, e.g. for a sidebar.</li><li><strong>Button style:</strong> “Icon and text” shows the service with a short text (on phones only the icon), “Icon only” saves space, “Icon and count” shows next to the icon how often the page was shared – the counter must be on for that.</li></ul>The buttons have the well-known Shariff look; your template's own CSS for the Shariff classes (<code>.shariff</code>, <code>.shariff-button</code>, <code>.share_text</code> …) keeps working."
PLG_JOOAG_SHARIFF_ORIENATATION="Orientation"
PLG_JOOAG_SHARIFF_ORIENATATION_HORIZONTAL="Horizontal"
PLG_JOOAG_SHARIFF_ORIENATATION_VERTICAL="Vertical"
